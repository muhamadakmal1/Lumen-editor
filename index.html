<style>
/* Layout: darkroom workbench. Slim top bar, canvas stage on the left, tabbed tool panel on the right; stacks on phones. */
:root{
  --bg:#121418; --panel:#1a1d23; --raise:#242830; --line:#2d323b; --fg:#e6e8ed; --mute:#8c94a3;
  --accent:#e8a33d; --accent-fg:#1a1204; --stage:#0d0f12; --danger:#e5645a;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;

}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9ecf0; --panel:#f7f8fa; --raise:#e3e6eb; --line:#ccd1d9; --fg:#1b1f27; --mute:#5d6676;
  --accent:#b86a00; --accent-fg:#ffffff; --stage:#d4d8df; --danger:#c43c32; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e9ecf0; --panel:#f7f8fa; --raise:#e3e6eb; --line:#ccd1d9; --fg:#1b1f27; --mute:#5d6676;
  --accent:#b86a00; --accent-fg:#ffffff; --stage:#d4d8df; --danger:#c43c32; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--f-body);overflow:hidden;
  padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font:700 18px/1 var(--f-display);letter-spacing:.02em;margin-right:6px;display:flex;align-items:center;gap:7px}
.brand i{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),#fff3,var(--accent));box-shadow:inset 0 0 0 3px var(--bg)}
.grp{display:flex;gap:4px;align-items:center}
.sp{flex:1}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:32px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.sm{min-height:26px;padding:3px 8px;font-size:12px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zoomval{font:12px var(--f-mono);min-width:44px;text-align:center;color:var(--mute)}
.app{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:10px}
.stage{position:relative;min-height:0;background:var(--stage);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:default}

.frame{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.frame canvas{display:block;box-shadow:0 8px 40px #0008;
  background:conic-gradient(#8883 25%,#0000 0 50%,#8883 0 75%,#0000 0) 0 0/16px 16px}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{pointer-events:auto}
.sel{position:absolute;border:calc(1.5px/var(--z,1)) dashed var(--accent);pointer-events:none}
.hdl{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);transform:translate(-50%,-50%) scale(calc(1/var(--z,1)));touch-action:none;cursor:nwse-resize;pointer-events:auto;z-index:3}
.crop-shade{position:absolute;background:#000a;pointer-events:none}

  background:linear-gradient(#fff4,#fff4) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff4,#fff4) 66.66% 0/1px 100% no-repeat,
  linear-gradient(#fff4,#fff4) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff4,#fff4) 0 66.66%/100% 1px no-repeat}
.crop-box b{position:absolute;width:18px;height:18px;background:#fff;border:2px solid #111;border-radius:3px;touch-action:none;transform:translate(-50%,-50%) scale(calc(1/var(--z,1)))}

.pane[hidden]{display:none}

.sec>h3{margin:0 0 6px;font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0}

.sl.chg output{color:var(--accent)}
.sl input{grid-column:1/-1;width:100%;margin:2px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--line) var(--a,0%),var(--accent) var(--a,0%),var(--accent) var(--b,0%),var(--line) var(--b,0%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--line) var(--a,0%),var(--accent) var(--a,0%),var(--accent) var(--b,0%),var(--line) var(--b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);border:2px solid var(--panel);margin-top:-5.5px;box-shadow:0 0 0 1px var(--mute)}

.chips{display:flex;flex-wrap:wrap;gap:5px}

.chip.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>.grow{flex:1;min-width:0}
.field{display:grid;gap:3px;margin:6px 0}
.field>span{color:var(--mute);font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raise);cursor:pointer;flex:none}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;margin:4px 0;background:var(--raise);cursor:pointer}
.layer.on{border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ic{font:700 11px var(--f-mono);width:22px;text-align:center;color:var(--mute)}
.ib{background:none;border:0;padding:3px 5px;border-radius:4px;color:var(--mute);line-height:1}
.ib:hover{color:var(--fg);background:var(--line)}
.ib svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.note{color:var(--mute);font-size:12px;margin:6px 0}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--mute)}
.hrow.on{background:var(--raise);color:var(--fg)}
.hrow.fut{opacity:.45}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:16px}
.modal.open{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px;display:grid;gap:10px}
.card h2{margin:0;font:700 18px var(--f-display)}
.pv{background:var(--stage);border-radius:6px;display:grid;place-items:center;padding:8px;min-height:120px}
.pv img{max-width:100%;max-height:34vh;display:block}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:860px){
  body{overflow:auto}
  .shell{height:auto;min-height:100%}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56vh auto}
  .panel{min-height:0}
  .pane{max-height:none;overflow:visible}
  .hide-sm{display:none}
}

<script>
"use strict";
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const el=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e};
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- state ---------- */
const DEF={exposure:0,brightness:0,contrast:0,highlights:0,shadows:0,whites:0,blacks:0,
  temp:0,tint:0,saturation:0,vibrance:0,hue:0,
  sharpen:0,clarity:0,blur:0,grain:0,vignette:0,fade:0,sepia:0,mono:0,invert:0,pixelate:0,
  shHue:210,shSat:0,hiHue:40,hiSat:0,balance:0,inBlack:0,inWhite:255,gamma:100};
const IDCURVE=()=>[[0,0],[255,255]];
function freshState(){return{params:{...DEF},filter:'none',filterAmt:100,
  curves:{m:IDCURVE(),r:IDCURVE(),g:IDCURVE(),b:IDCURVE()},
  geom:{rot:0,fh:false,fv:false,angle:0,crop:{x:0,y:0,w:1,h:1}},
  frame:{w:0,color:'#ffffff',radius:0},layers:[],uid:1}}
let state=freshState();
let srcFull=null,srcPrev=null,srcId=0,imgName='sample';

const PRESETS={
  none:{},
  vivid:{contrast:14,saturation:26,vibrance:25,clarity:14},
  mono:{mono:100,contrast:12},
  noir:{mono:100,contrast:42,blacks:-25,vignette:-38,grain:22},
  silver:{mono:100,contrast:-8,fade:10,highlights:-12,clarity:10},
  sepia:{sepia:85,contrast:6,vignette:-16},
  fade:{fade:28,contrast:-12,saturation:-15,temp:6},
  warm:{temp:30,tint:6,saturation:10,exposure:6},
  cool:{temp:-30,tint:-4,saturation:6},
  vintage:{fade:22,temp:16,saturation:-20,grain:30,vignette:-26,sepia:20},
  dramatic:{contrast:36,clarity:32,saturation:-14,shadows:-20,vignette:-30},
  matte:{fade:36,contrast:-6,blacks:15,saturation:-8},
  cinema:{contrast:18,shSat:45,shHue:200,hiSat:36,hiHue:35,saturation:-8,vignette:-18},
  golden:{temp:36,exposure:8,highlights:-12,hiSat:40,hiHue:42,vibrance:15},
  cyber:{shSat:60,shHue:280,hiSat:50,hiHue:175,contrast:20,saturation:15}
};
const PNAMES={none:'Original',vivid:'Vivid',mono:'Mono',noir:'Noir',silver:'Silver',sepia:'Sepia',fade:'Fade',warm:'Warm',cool:'Cool',vintage:'Vintage',dramatic:'Dramatic',matte:'Matte',cinema:'Cinema',golden:'Golden hour',cyber:'Cyber'};

function effParams(st){st=st||state;const p={...st.params};const f=PRESETS[st.filter];const a=st.filterAmt/100;
  if(f&&st.filter!=='none')for(const k in f){if(k==='shHue'||k==='hiHue')p[k]=f[k];else p[k]=(p[k]||0)+f[k]*a}
  return p}

/* ---------- curves ---------- */
function curveLUT(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]),n=p.length;
  if(n===2&&p[0][0]===0&&p[0][1]===0&&p[1][0]===255&&p[1][1]===255)return null;
  const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),dx=[],m=[],t=new Array(n);
  for(let i=0;i<n-1;i++){dx[i]=(xs[i+1]-xs[i])||1e-6;m[i]=(ys[i+1]-ys[i])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}
  const lut=new Uint8Array(256);let j=0;
  for(let x=0;x<256;x++){
    while(j<n-2&&x>xs[j+1])j++;
    let y;if(x<=xs[0])y=ys[0];else if(x>=xs[n-1])y=ys[n-1];else{
      const h=dx[j],u=(x-xs[j])/h,u2=u*u,u3=u2*u;
      y=(2*u3-3*u2+1)*ys[j]+(u3-2*u2+u)*h*t[j]+(-2*u3+3*u2)*ys[j+1]+(u3-u2)*h*t[j+1]}
    lut[x]=clamp(Math.round(y),0,255)}
  return lut}

/* ---------- blur ---------- */
function boxBlur(src,W,H,r){
  r=Math.max(1,Math.round(r));const win=2*r+1,tmp=new Uint8ClampedArray(src.length),out=new Uint8ClampedArray(src.length);
  for(let y=0;y<H;y++){const row=y*W*4;
    for(let ch=0;ch<3;ch++){let s=0;for(let k=-r;k<=r;k++)s+=src[row+clamp(k,0,W-1)*4+ch];
      for(let x=0;x<W;x++){tmp[row+x*4+ch]=s/win;s+=src[row+Math.min(W-1,x+r+1)*4+ch]-src[row+Math.max(0,x-r)*4+ch]}}}
  const st=W*4;

  $('#pv').textContent='Rendering…';$('#ex-info').textContent='';await new Promise(r=>setTimeout(r,30));
  const[w,h]=outSize();let c=render('full',Math.round(Math.max(w,h)*scale));
  if(fmt==='jpeg'){const f=mk(c.width,c.height),x=f.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(c,0,0);c=f}
  const blob=await new Promise(r=>c.toBlob(r,'image/'+fmt,q));if(tok!==exTok||!blob)return;
  exCanvas=c;exBlob=blob;if(exUrl)URL.revokeObjectURL(exUrl);exUrl=URL.createObjectURL(blob);
  $('#pv').textContent='';$('#pv').append(el('img',{src:exUrl,alt:'Export preview'}));
  $('#ex-info').textContent=c.width+' × '+c.height+' px · '+(blob.size>1048576?(blob.size/1048576).toFixed(1)+' MB':Math.round(blob.size/1024)+' KB')+(srcFull&&(srcFull.width>=4096||srcFull.height>=4096)?' · source is capped at 4096 px':'')}
function closeExport(){exm.classList.remove('open');exTok++;if(exUrl){URL.revokeObjectURL(exUrl);exUrl=null}}
$('#export').onclick=()=>{if(!srcFull)return;if(cropMode)leaveCrop(true);$('#ex-name').value=(imgName||'photo')+'-lumen';exm.classList.add('open');buildExport()};
['ex-fmt','ex-scale','ex-q'].forEach(id=>$('#'+id).addEventListener('input',queueExport));
$('#ex-close').onclick=closeExport;exm.addEventListener('pointerdown',e=>{if(e.target===exm)closeExport()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&exm.classList.contains('open'))closeExport()});
$('#ex-save').onclick=async()=>{if(!exBlob)return;const d=await getDownloads(),ext=exBlob.type==='image/jpeg'?'jpg':exBlob.type==='image/webp'?'webp':'png',name=($('#ex-name').value||'lumen-edit').replace(/[\\/:*?"<>|]+/g,'-');
  if(!d){toast('Saving is not available in this view. Press and hold (or right-click) the preview to save it.');return}
  try{await d.save({filename:name+'.'+ext,data:exBlob});toast('Saved '+name+'.'+ext)}catch(e){if(e&&e.code==='declined')return;toast('Could not save: '+((e&&e.message)||'unknown error'))}};
$('#ex-copy').onclick=async()=>{if(!exCanvas)return;try{const pb=await new Promise(r=>exCanvas.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':pb})]);toast('Image copied')}catch(e){toast('Copying is blocked here. Press and hold the preview instead.')}};

/* ---------- boot ---------- */
mountTabs();buildAdjust();buildCurves();buildCrop();buildDraw();
setTab('adjust');
document.fonts&&document.fonts.ready.then(()=>redraw());
setSource(makeSample(),'sample');
</script>
